kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# extraPortMappings на control-plane пробрасывают порты хост -> kind-контейнер
# -> NodePort Service. Это позволяет обращаться к сервисам напрямую по
# localhost:PORT без kubectl port-forward.
nodes:
  - role: control-plane
    extraPortMappings:
      # Webapp: нагрузочные маршруты (Locust -> http://localhost:8080)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Webapp API: REST/SSE для фронтенда (Vue -> http://localhost:5001)
      - containerPort: 30051
        hostPort: 5001
        protocol: TCP
      # Prometheus (браузер / Grafana / api.py -> http://localhost:9090)
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
  - role: worker
  - role: worker
